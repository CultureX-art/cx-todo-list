openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
paths:
  /auth/signup:
    post:
      summary: Register user
  /auth/login:
    post:
      summary: Login user
  /me:
    get:
      summary: Get current user
  /tasks:
    get:
      summary: List tasks
    post:
      summary: Create task
  /tasks/{id}:
    patch:
      summary: Update task
    delete:
      summary: Delete task
